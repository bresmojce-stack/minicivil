  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; min-height: 100vh; min-height: 100dvh; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; background: var(--bF1F5F9); color: var(--t1E293B); -webkit-font-smoothing: antialiased; }
  /* números en letra de ancho fijo (cotas, abscisas, lecturas) */
  [style*="monospace"], input[inputmode="decimal"], code { font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace !important; }
  #root { width: 100%; min-height: 100vh; min-height: 100dvh; }
  input, select, button { font-family: inherit; }
  button { touch-action: manipulation; }

  /* ── Cabecera ── */
  .tv-header { background: var(--b0F172A); color: var(--tFFFFFF); display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; border-bottom: 1px solid var(--l1E293B);
    box-shadow: 0 4px 14px rgba(15,23,42,0.18);
    padding: 12px max(18px, env(safe-area-inset-right)) 12px max(18px, env(safe-area-inset-left)); padding-top: max(12px, env(safe-area-inset-top)); }
  .tv-brand { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; white-space: nowrap; display: flex; align-items: center; gap: 11px; }
  .tv-logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(14,165,233,0.35); flex: 0 0 auto; }
  .tv-sub { font-size: 11.5px; color: var(--t94A3B8); font-weight: 500; letter-spacing: 0; margin-top: 1px; }
  .tv-proyecto { display: flex; gap: 8px; align-items: center; flex: 1 1 auto; min-width: 0; }
  .tv-proyecto select { border: 1px solid var(--l334155); background: var(--b1E293B); color: var(--tFFFFFF); border-radius: 9px; padding: 7px 10px; font-size: 14px; font-weight: 600; min-width: 0; max-width: 260px; flex: 0 1 auto; outline: none; }
  .tv-acciones { display: flex; gap: 8px; align-items: center; }
  .tv-volver { background: var(--b1E293B); color: var(--tE2E8F0); border: 1px solid var(--l334155); border-radius: 9px; display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 11px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; max-width: 45%; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
  .tv-volver:hover { background: var(--b334155); }
  .tv-btn { transition: filter .15s, transform .05s, box-shadow .15s; }
  .tv-btn:hover { filter: brightness(1.08); }
  .tv-btn:active { transform: translateY(1px); }
  .tv-in:focus { border-color: var(--l0EA5E9) !important; box-shadow: 0 0 0 3px rgba(14,165,233,0.16); background: var(--bFFFFFF) !important; }
  .tv-card { box-shadow: 0 1px 2px rgba(15,23,42,0.05), 0 1px 3px rgba(15,23,42,0.04); }
  .tv-acciones button { white-space: nowrap; }
  @media (max-width: 640px) { .tv-dib-txt { display: none; } }
  .tv-dib-lupa * { vector-effect: non-scaling-stroke; }
  .tv-dib-marca { animation: tvPulso 1s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes tvPulso { 50% { opacity: 0.35; } }
  .tv-guardado { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--t94A3B8); white-space: nowrap; }
  .tv-guardado.error { color: var(--tFCA5A5); }
  .tv-bloqueada input.tv-in, .tv-bloqueada textarea { background: var(--bF1F5F9) !important; color: var(--t475569) !important; cursor: not-allowed; }
  .tv-banner-bloqueo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--bFFFBEB); border-bottom: 1px solid var(--lFDE68A); color: var(--t92400E); padding: 9px 16px; font-size: 13px; font-weight: 600; }
  .tv-aviso { pointer-events: none; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 130; background: var(--b0F172A); color: var(--tFFFFFF); padding: 11px 18px; border-radius: 12px; font-size: 13.5px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.3); max-width: calc(100vw - 32px); text-align: center; }

  /* ── Pestañas: una sola fila que se desliza, fija arriba al hacer scroll ── */
  .tv-tabs { display: flex; gap: 2px; background: var(--b1E293B); overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; padding: 6px 12px 0; }
  .tv-tabs::-webkit-scrollbar { display: none; }
  .tv-tabs button { flex: 0 0 auto; display: inline-flex; flex-direction: column; align-items: center; gap: 4px; padding: 7px 16px 8px; border: none; border-radius: 10px 10px 0 0;
    background: none; font-size: 12.5px; font-weight: 700; color: var(--tCBD5E1); cursor: pointer; white-space: nowrap; transition: color .15s, background .15s; }
  .tv-tabs button:hover { background: rgba(255,255,255,0.07); color: var(--tFFFFFF); }
  .tv-lect-cartel { position: sticky; top: 0; z-index: 6; margin-bottom: 6px; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 800; background: var(--bFFF6D6); color: var(--t7C2D12); border: 2px solid var(--lD97706); }
  .tv-lect tbody tr:focus-within > td { background: var(--bFEF3C7) !important; border-top: 2px solid var(--lD97706); border-bottom: 2px solid var(--lD97706); }
  .tv-lect tbody tr:focus-within > td:first-child { box-shadow: inset 7px 0 0 var(--lD97706); }
  .tv-lect tbody tr:focus-within input:focus { border: 3px solid var(--l1D4ED8) !important; box-shadow: 0 0 0 3px rgba(29,78,216,0.25); }
  .tv-lect[data-act="0"] thead th:nth-child(3), .tv-lect[data-act="1"] thead th:nth-child(4), .tv-lect[data-act="2"] thead th:nth-child(5), .tv-lect[data-act="3"] thead th:nth-child(6), .tv-lect[data-act="4"] thead th:nth-child(7) { background: var(--bFBBF24) !important; color: var(--t1E293B) !important; }
  .tv-tabs button.activa { background: var(--bFFFFFF); color: var(--t0369A1); }
  .tv-corto { display: none; }
  /* Las pestañas y debajo los apartados de la pestaña abierta quedan juntas fijas arriba */
  .tv-barras { position: sticky; top: 0; z-index: 50; }
  .tv-subvia { display: flex; gap: 6px; padding: 6px 12px; background: var(--bFFFFFF); border-bottom: 1px solid var(--lE2E8F0); box-shadow: 0 2px 4px rgba(15,23,42,0.06); overflow-x: auto; scrollbar-width: none; }
  .tv-subvia button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--lE2E8F0); background: var(--bF8FAFC); border-radius: 16px; padding: 4px 12px 4px 7px;
    font-size: 12px; font-weight: 700; color: var(--t475569); cursor: pointer; white-space: nowrap; }
  .tv-subvia button:hover { background: var(--bF1F5F9); }
  .tv-subvia button { position: relative; }
  .tv-punto { position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bFFFFFF); pointer-events: none; }

const proyectoNuevo = nombre => ({ id: Date.now() + Math.random(), nombre: nombre || "Nuevo proyecto", creado: new Date().toISOString(), dibujos: [] });
function useLocalProyectos() {
  const [proyectos, _setProyectos] = React.useState(function() {
    try { const d = leerDato(TV_KEY); if (Array.isArray(d)) return d.filter(viaValida); } catch (e) {}
    return [];
  });
  HIST.actual.proyectos = proyectos;
  HIST.crudo.proyectos = function(v) { HIST.actual.proyectos = v; guardarDato(TV_KEY, v); _setProyectos(v); };
  HIST.crudo.obras = function() {};   // Mini Civil todavía no tiene obras (deshacer de TopoVías las mueve también)
  const setProyectos = React.useCallback(function(updater) {
    _setProyectos(function(prev) {
      const next = typeof updater === "function" ? updater(prev) : updater;
      if (next !== prev) {
        histAntesDeCambio({ proyectos: prev, obras: [] });
        HIST.actual.proyectos = next;
        guardarDato(TV_KEY, next);
      }
      return next;
    });
  }, []);
  return [proyectos, setProyectos];
}
function copiaDeProyectos(proyectos) {
  const datos = { app: "MiniCivil", version: 1, fecha: new Date().toISOString(), proyectos };

}

function TarjetaNube() {
  const [, setN] = React.useState(0);
  const [abierto, setAbierto] = React.useState(false);
  React.useEffect(() => { const f = () => setN(n => n + 1); window.addEventListener("tv-nube", f); return () => window.removeEventListener("tv-nube", f); }, []);
  const m = nubeMeta(), con = !!m.conectado;
  const h = React.createElement;
  return h(Card, { title: "☁️ Copia en Google Drive" },
    h("div", { style: { fontSize: 13, color: C.muted, marginBottom: 12, lineHeight: 1.5 } },
      con ? h(React.Fragment, null, "Conectado como ", h("strong", null, m.email || "tu cuenta de Google"), ". " + (m.ultima ? "Última sincronización: " + new Date(m.ultima).toLocaleString("es-CO", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) + "." : "Todavía no se ha sincronizado."))
        : "Guarda tus proyectos también en tu propio Google Drive (carpeta \u201cMini Civil\u201d) para tenerlos en el celular, la tablet y el PC."),
    h(Btn, { color: C.accent, style: { width: "100%", padding: "12px 16px", fontSize: 15, minHeight: 48 }, onClick: () => { setAbierto(true); nubeCargarGIS().catch(() => {}); } },
      h(Icono, { n: con ? "cloud-check" : "cloud", size: 18 }), con ? "Ver Drive y sincronizar" : "Conectar con Google Drive"),
    abierto && h(PanelNube, { onCerrar: () => setAbierto(false) }));
}
function PantallaProyectos({ proyectos, onAbrir, onNuevo, onRenombrar, onDuplicar, onEliminar }) {

  const accion = (txt, color, fn) => h("button", {
    onClick: e => { e.stopPropagation(); fn(); }, className: "tv-mezcla",

  }, txt);
  return h("div", null,

    h(Card, { title: "📐 Proyectos" },
      h("div", { style: { fontSize: 13, color: C.muted, marginBottom: 12 } },

      h(FormNombre, { placeholder: "Nombre del proyecto (ej. Lote 4 Carambolo)", boton: "+ Crear proyecto", onCrear: onNuevo })),
    proyectos.length === 0

      : h("div", { style: gridTarjetas },

            return h("div", { key: p.id, role: "button", tabIndex: 0, className: "mc-proyecto", onClick: () => onAbrir(p.id),
              onKeyDown: e => { if (e.key === "Enter") onAbrir(p.id); },

              h("div", { style: { fontSize: 12.5, color: C.muted } },

function App() {
  // cambiar de tema redibuja la app (lo que no usa variables de color, como el dibujo, toma el tema nuevo)
  const [, setTemaV] = React.useState(0);
  React.useEffect(() => { const f = () => setTemaV(v => v + 1); window.addEventListener("tv-tema", f); return () => window.removeEventListener("tv-tema", f); }, []);
  const [proyectos, setProyectos] = useLocalProyectos();
  // Pantalla: "inicio" (lista de proyectos) → "proyecto" (sus dibujos)
  const [nav, setNav] = React.useState(() => {
    const n = lsLeer(TV_KEY + "_nav", null);
    return n && n.vista === "proyecto" && proyectos.some(p => p.id === n.id) ? n : { vista: "inicio" };
  });
  React.useEffect(() => { lsGuardar(TV_KEY + "_nav", nav); }, [nav]);
  const [archivo, setArchivo] = React.useState(null); // DXF o copia, listo para guardar o compartir
  const [aviso, setAviso] = React.useState("");
  React.useEffect(() => {
    let reloj = null;
    const f = e => { setAviso(e.detail); clearTimeout(reloj); reloj = setTimeout(() => setAviso(""), 3200); };
    window.addEventListener("tv-aviso", f);
    return () => { window.removeEventListener("tv-aviso", f); clearTimeout(reloj); };
  }, []);
  // ── Deshacer / rehacer (lo del dibujo tiene su propio deshacer dentro del Dibujo) ──
  const [, setVerHist] = React.useState(0);
  React.useEffect(() => {
    const oyente = () => setVerHist(v => v + 1);
    HIST.oyentes.push(oyente);
    const tecla = e => {
      if (!(e.ctrlKey || e.metaKey) || e.altKey || nav.vista === "proyecto") return;
      const el = document.activeElement;
      if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable)) return;
      const k = e.key.toLowerCase();
      if (k === "z" && !e.shiftKey) { if (deshacer()) e.preventDefault(); }
      else if (k === "y" || (k === "z" && e.shiftKey)) { if (rehacer()) e.preventDefault(); }
    };
    window.addEventListener("keydown", tecla);
    return () => { HIST.oyentes = HIST.oyentes.filter(f => f !== oyente); window.removeEventListener("keydown", tecla); };
  }, [nav.vista]);
  const botonHist = (txt, titulo, fn, activo) => React.createElement("button", {
    onClick: fn, disabled: !activo, title: titulo, "aria-label": titulo,
    style: { border: "none", background: activo ? C.relleno : "var(--bB0BEC5)", color: "var(--tFFFFFF)", fontWeight: 800, fontSize: 14,
      padding: "10px 14px", cursor: activo ? "pointer" : "default", minWidth: 44, minHeight: 44 }
  }, txt);
  const barraDeshacer = nav.vista !== "proyecto" && (HIST.atras.length > 0 || HIST.adelante.length > 0) && React.createElement("div", {
    className: "tv-deshacer",
    style: { position: "fixed", right: 14, bottom: "calc(14px + env(safe-area-inset-bottom, 0px))", zIndex: 90, display: "flex",
      borderRadius: 24, overflow: "hidden", boxShadow: "0 4px 14px rgba(0,0,0,0.25)", gap: 1, background: "var(--bFFFFFF)" }
  },
    botonHist("↶ Deshacer", "Deshacer el último cambio (Ctrl+Z)", deshacer, HIST.atras.length > 0),
    botonHist("↷", "Rehacer (Ctrl+Y)", rehacer, HIST.adelante.length > 0));

  // ── Proyectos ──
  const proy = nav.vista === "proyecto" ? proyectos.find(p => p.id === nav.id) : null;
  const pestana = PESTANAS_PROY.some(p => p[0] === nav.tab) ? nav.tab : "dibujo";
  const abrir = id => { setNav({ vista: "proyecto", id }); window.scrollTo(0, 0); };
  const crear = nombre => { const p = proyectoNuevo(nombre); setProyectos(prev => prev.concat([p])); abrir(p.id); };
  const renombrar = id => {
    const p = proyectos.find(x => x.id === id); if (!p) return;
    const n = prompt("Nuevo nombre del proyecto", p.nombre); if (!n || !n.trim()) return;
    setProyectos(prev => prev.map(x => x.id === id ? { ...x, nombre: n.trim() } : x));
  };
  const duplicar = id => {
    const p = proyectos.find(x => x.id === id); if (!p) return;
    const copia = JSON.parse(JSON.stringify(p));
    copia.id = Date.now() + Math.random(); copia.nombre = p.nombre + " (copia)"; copia.creado = new Date().toISOString();
    setProyectos(prev => prev.concat([copia]));
  };
  const eliminar = id => {
    const p = proyectos.find(x => x.id === id);
    if (!p || !confirm(`¿Eliminar el proyecto "${p.nombre}" y sus dibujos? Puedes recuperarlo con ↶ Deshacer mientras la app esté abierta.`)) return;

            pestana === "superficies" && h(TabSuperficies, { key: proy.id, proy, onVer3D: null,
              onSupers: l => setProyectos(prev => prev.map(p => p.id === proy.id ? { ...p, superficies: l } : p)) }))
        : h(PantallaProyectos, { proyectos, onAbrir: abrir, onNuevo: crear, onRenombrar: renombrar, onDuplicar: duplicar, onEliminar: eliminar })),

// Si algo falla al mostrar la app, en vez de una pantalla en blanco se ofrece guardar los datos y recuperar
class FalloApp extends React.Component {

      React.createElement("p", { style: { lineHeight: 1.5 } }, "Tus datos siguen guardados en este equipo. Primero guarda una copia de tus datos; después prueba volver a abrir. Si sigue fallando, restaura la última copia automática."),
      React.createElement("p", { style: { fontSize: 12, color: "var(--t64748B)" } }, String(this.state.error && this.state.error.message || this.state.error)),

var __minicivilRoot__ = ReactDOM.createRoot(document.getElementById("root"));
// Primero se cargan los datos guardados en el dispositivo, luego se muestra la app
precargarDatos([TV_KEY, TV_KEY_OBRAS]).then(function() {
  __minicivilRoot__.render(React.createElement(React.Fragment, null, React.createElement(FalloApp, null, React.createElement(App)), React.createElement(AvisoOtraVentana)));
  setTimeout(nubeIniciar, 800);
  if (DATOS.avisoCarga) setTimeout(function() { alert("⚠ No se pudieron abrir todos tus datos guardados (la base de datos del equipo no respondió).\n\nNo se perdió nada: cierra las otras pestañas o ventanas de Mini Civil y vuelve a abrir la app."); }, 300);
});
// Modo sin conexión (solo cuando la app se abre desde una dirección web, no como archivo suelto)
// Cuando llega una versión nueva con la app abierta, se avisa con un botón "Actualizar"
// (los datos ya están guardados, recargar no pierde nada).
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("sw.js").then(function(reg) {
      // al volver a la app (estaba en segundo plano) buscar si hay versión nueva
      document.addEventListener("visibilitychange", function() { if (document.visibilityState === "visible") reg.update().catch(function() {}); });
    }).catch(function(e) { console.warn("Sin modo offline:", e); });
    var habiaControl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function() {
      if (!habiaControl) { habiaControl = true; return; }   // primera instalación: no hace falta avisar
      if (document.getElementById("tv-nueva-version")) return;
      var d = document.createElement("div");
      d.id = "tv-nueva-version";
      d.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:200;background:var(--b0F172A);color:var(--tFFFFFF);padding:10px 12px 10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:12px;align-items:center;font:600 13.5px 'Plus Jakarta Sans',sans-serif;max-width:calc(100vw - 32px)";
      d.innerHTML = "<span>Hay una versión nueva de Mini Civil</span>";
      var b = document.createElement("button");
      b.textContent = "Actualizar";
      b.style.cssText = "background:var(--b0284C7);color:var(--tFFFFFF);border:none;border-radius:8px;padding:8px 14px;font:700 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer";
      b.onclick = function() { location.reload(); };
      d.appendChild(b);
      document.body.appendChild(d);
    });
  });
}
